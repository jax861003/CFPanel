# 云端部署器 —— 面板自动部署到 Cloudflare Pages（面向 fork 用户）
# fork 本仓库后，在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN（需 Cloudflare Pages 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID
# 配置完成后，每次 push 到 main（或手动触发）会自动把面板部署到你的 Pages 项目。
# 未配置 secrets 时相关步骤自动跳过（显示 skipped，不会报错）。
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install
      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler pages deploy public --project-name deploy-panel-v2 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}